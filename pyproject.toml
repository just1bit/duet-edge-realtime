[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duet-edge-realtime"
version = "0.2.0"
description = "V1 near-realtime streaming service for Duet-EDGE"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "websockets>=12"]

[project.optional-dependencies]
local = [
    "pytest>=8",
]
gpu = [
    "accelerate>=0.24,<1.0",
    "einops",
    "fvcore",
    "iopath",
    "librosa",
    "matplotlib",
    "ninja",
    "p_tqdm",
    "scipy",
    "soundfile",
    "torch==2.7.0",
    "tqdm",
    "wandb",
    "pytest>=8",
]

[project.scripts]
duet-edge-realtime = "duet_edge_realtime.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
