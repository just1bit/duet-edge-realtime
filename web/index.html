<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Duet-EDGE Realtime V2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">DUET-EDGE / REALTIME V2</p><h1>Lead &amp; Companion Motion</h1></div>
      <div class="badges"><span id="backend" class="badge mode">WAITING</span><span id="connection" class="badge offline">Disconnected</span></div>
    </header>
    <section class="controls primary">
      <label>WebSocket <input id="ws-url" value="ws://127.0.0.1:8765"></label>
      <button id="connect">Connect</button>
      <label class="file">Open NDJSON<input id="file" type="file" accept=".ndjson,application/x-ndjson"></label>
      <button id="pause" class="ghost">Pause</button>
      <button id="restart" class="ghost">Restart</button>
    </section>
    <section class="controls transport">
      <label class="seek">Timeline <input id="seek" type="range" min="0" max="0" value="0"></label>
      <label>Speed <select id="speed"><option>.5</option><option selected>1</option><option>1.5</option><option>2</option></select></label>
      <button id="world" class="ghost active">Shared World</button>
      <button id="diagnostic" class="ghost">Side-by-Side</button>
      <button id="camera-left" class="icon ghost" aria-label="Rotate camera left">↶</button>
      <button id="camera-right" class="icon ghost" aria-label="Rotate camera right">↷</button>
      <button id="zoom" class="icon ghost" aria-label="Change zoom">＋</button>
    </section>
    <section class="stage">
      <canvas id="canvas" width="1180" height="680"></canvas>
      <div class="latency"><span>Declared Fixed Latency</span><strong id="latency">—</strong></div>
      <div id="guidance" class="guidance">Connecting automatically…</div>
    </section>
    <section class="metrics">
      <article><span>State</span><strong id="status">Disconnected</strong></article>
      <article><span>Frame / Clip</span><strong id="frame">—</strong></article>
      <article><span>Frame Age</span><strong id="age">—</strong></article>
      <article><span>Inference P95</span><strong id="p95">—</strong></article>
      <article><span>Jitter / Drops</span><strong id="delivery">—</strong></article>
      <article><span>Render FPS</span><strong id="render-fps">—</strong></article>
      <article><span>Checkpoint / Steps</span><strong id="model">—</strong></article>
      <article><span>Reconnects</span><strong id="reconnects">0</strong></article>
    </section>
  </main>
  <script src="viewer.js?v=v3-final"></script>
</body>
</html>
