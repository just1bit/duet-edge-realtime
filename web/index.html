<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Duet Realtime Motion Viewer</title>
  <link rel="stylesheet" href="style.css?v=monitor-minimal-14">
</head>
<body>
  <main>
    <header class="topbar">
      <div class="brand">
        <h1>Duet Realtime Motion Viewer</h1>
      </div>
      <section class="toolbar" aria-label="Viewer controls">
        <input id="ws-url" aria-label="WebSocket" value="ws://127.0.0.1:8765" spellcheck="false">
        <button id="connect" class="primary">Connect Live</button>
        <label class="file-button">Open NDJSON<input id="file" type="file" accept=".ndjson,application/x-ndjson"></label>
        <button id="play" class="secondary" disabled>Pause</button>
      </section>
      <div class="status-group" aria-live="polite">
        <span id="mode" class="mode-pill">LIVE</span>
        <span id="connection" class="status-pill waiting"><i></i>Waiting for stream</span>
      </div>
    </header>

    <section class="viewer" aria-label="Lead and companion skeleton viewer">
      <div class="dancer-label lead"><i></i><span>LEAD</span><small>Source motion</small></div>
      <div class="dancer-label companion"><i></i><span>COMPANION</span><small>Generated motion</small></div>
      <div class="center-line" aria-hidden="true"></div>
      <canvas id="canvas" width="1200" height="600"></canvas>
      <div id="empty-state" class="empty-state">
        <strong>Waiting for motion</strong>
        <span>Connects automatically, or open an NDJSON recording.</span>
      </div>
      <div class="drag-hint">Drag canvas to rotate view</div>
    </section>

    <section class="metrics" aria-label="Realtime metrics">
      <article><span>Frame · Clip</span><strong id="frame">—</strong></article>
      <article><span>Stream Time</span><strong id="stream-time">—</strong></article>
      <article><span>Viewer Delay</span><strong id="age">—</strong></article>
      <article><span>Pipeline Latency</span><strong id="e2e">—</strong></article>
      <article><span>Model Inference P95</span><strong id="p95">—</strong></article>
      <article><span>Jitter · Drops</span><strong id="delivery">—</strong></article>
    </section>
  </main>
  <script src="viewer.js?v=monitor-minimal-15"></script>
</body>
</html>
